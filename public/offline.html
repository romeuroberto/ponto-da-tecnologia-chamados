<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão | Portal do Cliente</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #0284c7;
        --border: #e2e8f0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(14, 165, 233, 0.12), transparent 32%),
          linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }

      .card {
        width: 100%;
        max-width: 420px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--card);
        padding: 28px 24px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        background: #e0f2fe;
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 8px 12px;
      }

      h1 {
        margin: 16px 0 8px;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.65;
      }

      .actions {
        margin-top: 20px;
        display: grid;
        gap: 12px;
      }

      button,
      a {
        height: 48px;
        border-radius: 18px;
        border: 1px solid var(--border);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
      }

      button {
        cursor: pointer;
        background: #0f172a;
        border-color: #0f172a;
        color: white;
      }

      a {
        background: white;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Portal do Cliente</div>
      <h1>Você está sem conexão</h1>
      <p>
        Não foi possível carregar esta tela agora. Assim que a internet voltar, tente novamente para continuar usando o portal.
      </p>
      <div class="actions">
        <button type="button" onclick="window.location.reload()">Tentar novamente</button>
        <a href="/portal-app">Voltar para o início do app</a>
      </div>
    </main>
  </body>
</html>
